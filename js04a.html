<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="x">
    <button onclick="calcu()">OK</button>
    <h1></h1>
    <script>
      const x = document.getElementById("x")
      const h1 = document.querySelector("h1") 

        function calcu(){
            if(x.value > 0) {
                h1.innerHTML = `musbet`
            }else if(x.value < 0){
                h1.innerHTML = `menfi`
            }else{
                h1.innerHTML = `sifir`
            }
        }
    </script>
</body>
</html>

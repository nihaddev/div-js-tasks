<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table id="cdv"></table>
    <script>
      let cdv = document.getElementById("cdv");
      let kod = '';
      for (let i = 1; i <= 4; i++) {
        kod += `<tr>`;
        for (let i = 1; i <= 4; i++) {
          kod += "<td></td>";
        }
        kod += `</tr>`;
      }
      cdv.innerHTML = kod;
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="flex justify-center items-center pt-10 bg-gray-900 h-[100vh]">
      <div
        class="flex flex-col max-w-md p-6 rounded-md sm:p-10 dark:bg-gray-50 dark:text-gray-800"
      >
        <div class="mb-8 text-center">
          <h1 class="my-3 text-4xl font-bold">Sign in</h1>
          <p class="text-sm dark:text-gray-600">
            Sign in to access your account
          </p>
        </div>
        <form novalidate="" action="" class="space-y-12">
          <div class="space-y-4">
            <div>
              <label for="email" class="block mb-2 text-sm"
                >Email address</label
              >
              <input
                type="email"
                name="email"
                id="username"
                placeholder="leroy@jenkins.com"
                class="w-full px-3 py-2 border rounded-md dark:border-gray-300 dark:bg-gray-50 dark:text-gray-800"
              />
            </div>
            <div>
              <div class="flex justify-between mb-2">
                <label for="password" class="text-sm">Password</label>
                <a
                  rel="noopener noreferrer"
                  href="#"
                  class="text-xs hover:underline dark:text-gray-600"
                  >Forgot password?</a
                >
              </div>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="*****"
                class="w-full px-3 py-2 border rounded-md dark:border-gray-300 dark:bg-gray-50 dark:text-gray-800"
              />
            </div>
          </div>
          <div class="space-y-2">
            <div>
              <button
                type="button"
                class="w-full px-8 py-3 font-semibold rounded-md dark:bg-violet-600 dark:text-gray-50"
                onclick="login()"
              >
                Sign in
              </button>
            </div>
            <p id="msj" class="text-center pt-10"></p>
          </div>
        </form>
      </div>
    </div>
    <script>
        const username = document.getElementById("username");
        const password = document.getElementById("password");
        const msj = document.getElementById("msj");
        const usern = "salam";
        const passwd = "salam123"
        function login(){
           if(username.value !== usern || password.value !== passwd){
            msj.style.color = "red"
            msj.innerText = "giris ugursuzdur"
           }else {
            msj.style.color = "green"
            msj.innerText = "salam admin necesen"
           }
        }
       //q addEventListener('submit')
    </script>
  </body>
</html>

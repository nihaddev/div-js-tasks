<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid black;
            margin: auto;
        }

        td {
            font: bold 2em Arial;
            width: 100px;
            height: 100px;
            border: 1px solid #333;
            text-align: center;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1></h1>
    <table id="cdv"></table>

    <script>
       
        const cdv = document.getElementById('cdv')
        let kod = ''
        let arr = []
        let order = 1
        let sec = 20
        const h1 = document.querySelector('h1')
        for (let i = 1; i <= 16; i++) {
            arr.push(i)
        }
        let timer = setInterval(clock, 1000);
        kod += `<tr>`
        for (let i = 1; i <= 4; i++) {
            for (let j = 1; j <= 4; j++) {
                let n = rnd(0, arr.length - 1)
                kod += `<td onclick='show(this)'>${arr[n]}</td>`
                arr.splice(n, 1)
            }
            kod += `</tr>`
        } cdv.innerHTML = kod
        function rnd(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        function show(td) {

            if (td.innerHTML == order) {
                td.style.background = 'silver'
                td.style.color = '#eee'
                order++
                if (order <= 1 && order <= 16) {
                    gameover(false)


                }

                if (order > 16) {

                    gameover(true)
                }

            }
            else {
                order = 1
                let tds = document.querySelectorAll('td')
                for (let i = 0; i < tds.length; i++) {
                    tds[i].style.background = ""
                    tds[i].style.color = ""
                }
            }

        }
        function clock() {
            sec--
            h1.innerHTML = sec
            if (sec <= 0) {

                gameover(false)
            }
        }
        function gameover(res) {
            clearInterval(timer)
            let tds = document.querySelectorAll('td')
            order = 0
            if (res) {
                let Winner = ['W', 'I', 'N', 'N', 'E', 'R']
                for (let i = 0; i < tds.length; i++) {
                      tds[i].style.background = "Green"
                        tds[i].style.color = "White"
                        if (i >= 4 && i <= 9) {
                             tds[i].innerHTML=Winner[i-4]
                        }
                     else{tds[i].innerHTML=""}
                }
            }
            else {
                let game = ['G', 'A', 'M', 'E', 'O', 'V', 'E', 'R']
                   
                for (let i = 0; i < tds.length; i++) {
                    
                     tds[i].style.background = "black"
                        tds[i].style.color = "yellow"
                    if (i >= 4 && i <= 11) {
                       
                        tds[i].innerHTML=game[i-4]
                    }
                    else{tds[i].innerHTML=""}

                }
            }

        }

    </script>

</body>

</html>

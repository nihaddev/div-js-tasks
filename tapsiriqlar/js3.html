<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
  </head>
  <body>
    <input type="number" min="0" max="100" id="a" />
    <button onclick="compare()" id="c">?</button>
    <input type="number" min="0" max="100" id="b" />

    <script>
      const a = document.getElementById("a");
      const b = document.getElementById("b");
      let c = document.getElementById("c");
      function compare() {
        c.innerText = a.value > b.value ? ">" : a.value < b.value ? "<" : "=";
      }
    </script>
  </body>
</html>

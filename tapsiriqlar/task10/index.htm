<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <title>Document</title>
      <style>
        table {
            border-collapse: collapse;
            border: 1px solid black;
            margin: 80px auto;
        }

        td {
            font: bold 2em Arial;
            width: 100px;
            height: 100px;
            border: 1px solid #333;
        }
    </style>
</head>

<body>
    <table id="cdv"></table>
    <script>
        const cdv = document.getElementById('cdv')
        let kod = ''
        let arr = []
        let x = 0
        for (let i = 1; i <= 16; i++) {
            arr.push(i)
        }
        for (let f = arr.length - 1; f > 0; f--) {
            let c = Math.floor(Math.random() * (f + 1));
            [arr[f], arr[c]] = [arr[c], arr[f]];
        }
        for (let i = 1; i <= 4; i++) {
            kod += "<tr>";
            for (let j = 1; j <= 4; j++) {
                kod += `<td>${arr[x++]}</td>`;
            }
            kod += "</tr>";
        }

        cdv.innerHTML = kod;
    </script>
</body>

</html>

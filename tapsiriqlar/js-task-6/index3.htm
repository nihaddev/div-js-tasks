<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <input type="number" id="num">
    <input type="number" id="ber">
    <button onclick="multi()">Ok</button>
    <div id="txt"></div>
    <script>
         const txt = document.getElementById('txt')
         function multi() {
            let result=""
            const num=Number(document.getElementById('num').value)
             const ber=Number(document.getElementById('ber').value)
              const txt = document.getElementById('txt')
             for (let i = 1; i <= num; i+=ber) {
                
                if(num<=0||ber<=0)return;
                else if(i!=1)result+=','+i
                else result+=i
             }
             txt.innerHTML=result
             
         }
    </script>
</body>
</html>

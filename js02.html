<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <input type="text" id="ad" placeholder="Enter text"/>
    <button onclick="save()">ok</button>
    <h1 id="text"></h1>

        function save(){
            let ad = document.getElementById("ad");
            let test = document.getElementById("text");
            test.innerHTML = `salam dunya ${ad.value}`;

        }
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Document</title>
        <style>
            table { border-collapse: collapse; }
            td { font: bold 1.2em Arial; width: 50px; height: 50px; text-align: center;; }
            .black { background: orange; }
            .white { background: yellow; }
        </style>
    </head>
    <body>
        <select id="letter"></select>
        <select id="number"></select>
        <button>Ok</button>

        <table id="cdv"></table>
        <script>
            let kod=""
            let cdv = document.getElementById('cdv')
            let letter = document.getElementById('letter')
            let number = document.getElementById('number')
            let abc = ' ABCDEFGH'

            for (let i = 1; i <= 8; i++) {
                letter.innerHTML += `<option>${abc[i]}</option>`
                number.innerHTML += `<option>${i}</option>`
            }

                for(let i = 0; i <= 8; i++) {
                    let n = 1
                    kod += `<tr>`
                        for(let j = 0; j <= 8; j++){
                            let color = i == 0 || j == 0 ? '' :
                                        (i + j) % 2 ? 'black' : 'white'
                            let cell = i == 0 ? abc[j] :
                                       j == 0 ? i : 
                                       i == 1 && j == 2 ? '♞' : ''
                            kod += `<td class="${color}">${cell}</td>`
                        }
                    kod += `</tr>`
                }
             cdv.innerHTML = kod
        </script>
    </body>
</html>

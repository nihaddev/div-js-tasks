<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select name="" id="letter"></select>
    <select name="" id="number"></select>
    <table id="cdv"></table>
    <script>
        let kod = ""
        let cdv = document.getElementById("cdv")
        let abc = ' ABCDEFGH'

        for (let i = 0; i <= 8; i++ ){
            let n = 1;
            kod += `<tr>`
                for(let j = 0; j <= 8; j++){
                    let color = i == 0 || j == 0 ? '' :
                        (i+j) % 2 ? 'black' : 'white'
                    let cell = i == 0 ? abc[j] : j == 0 ? i : i == 1 && j == 2 ? 'at' : ''
                    kod += `<td class="${color}">${cell}</td>`
                }
        }
    </script>
</body>
</html>
